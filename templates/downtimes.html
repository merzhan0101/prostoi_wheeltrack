<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простои - {{ area_name }}</title>
    <link rel="shortcut icon" href="/static/sit_logo_11.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/downtimes.css?v={{ static_version }}">
</head>

<body>

    <input
        type="hidden"
        id="current-area-slug"
        value="{{ area_slug }}"
    >

    <input
        type="hidden"
        id="current-area-department-id"
        value="{{ area_department_id }}"
    >

    <div class="wrapper">
        
        <header>
            <div class="header__Container">
                <div class="header__info">
                    <div class="header__text">
                        <h1 id="header_text">
                            Простои — {{ area_name }}
                        </h1>
                    </div>
                    <div class="header__logo">
                        <a id="link" href="">
                            <img src="/static/pmk_logo.png">
                        </a>
                    </div>
                    <div class="header__user">
                        <div class="header__user-avatar" aria-hidden="true">P</div>
                        <div class="header__user-details">
                            <span class="header__user-label">Пользователь</span>
                            <span id="user_name">prostoi</span>
                        </div>
                        <span class="header__user-status" title="В сети"></span>
                    </div>
                </div>
            </div>
        </header>

        <div class="container downtime-view">
            <!-- <div class="top-nav">
                <div class="logo">PROMMASHKOMPLEKT</span></div>
            </div> -->

            <div class="glass-card">
                <div class="glass-header">
                    <div class="title-section">
                        <h1>Журнал простоев</h1>
                        <span class="modal-badge">Записи</span>
                    </div>

                    <div class="actions-container">
                        <div class="actions-section">
                            <button class="btn-neo btn-ins" id="instructionBtn" onclick="openPdf()">
                                <i class="fas fa-info-circle"></i>
                                ИНСТРУКЦИЯ
                            </button>
                        </div>

                        <div class="actions-section">
                            <button class="btn-neo btn-add" id="addNewBtn">
                                <i class="fas fa-plus"></i>
                                НОВАЯ ЗАПИСЬ
                            </button>
                        </div>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label><i class="far fa-calendar-alt"></i> Дата:</label>
                        <input type="date" id="filter-date-start" class="calendar-input">
                    </div>
                    <button class="btn-filter" title="Обновить данные">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Имя документа</th>
                                <th>Оборудование</th>
                                <th>Начало / Конец простоя</th>
                                <th>Тип простоя</th>
                                <th>Создал (ФИО)</th>
                                <th>Создано (Сист.)</th>
                                <!-- <th style="width: 70px;">ТОИР</th> -->
                                <th>Комментарий</th>
                                <!-- <th style="width: 100px;">Статус</th> -->
                                <th style="text-align:right">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="entryModal" class="modal">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h2><i class="fas fa-plus-circle"></i> Новая запись простоя</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <form id="entryForm">
                    <div class="modal-grid">
                        <div class="form-group full-width">
                            <label>Оборудование</label>
                            <div class="search-select-container" id="eq-container">
                                <div class="input-with-clear">
                                    <input type="text" class="search-input" id="modal-equipment-search"
                                        placeholder="Поиск оборудования..." autocomplete="off">
                                    <i class="fas fa-times clear-btn"></i> <!-- Кнопка очистки -->
                                </div>
                                <input type="hidden" id="modal-equipment-id" name="equipment_id">
                                <div id="selected-equipments" class="selected-equipments"></div>
                                <div class="search-dropdown" id="eq-dropdown"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Начало простоя</label>
                            <input type="datetime-local" id="modal-start" required>
                        </div>

                        <div class="form-group">
                            <label>Конец простоя</label>
                            <input type="datetime-local" id="modal-end">
                        </div>

                        <div class="form-group">
                            <label>Тип простоя</label>
                            <select id="modal-type" required>
                                <option value="">Выберите тип...</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Кто создает (ФИО)</label>
                            <div class="search-select-container" id="worker-container">
                                <input type="text" class="search-input" id="modal-worker-search"
                                    placeholder="Поиск сотрудника..." autocomplete="off">
                                <input type="hidden" id="modal-worker-id" name="creator_id">
                                <div class="search-dropdown" id="worker-dropdown">
                                </div>
                                <i class="fas fa-chevron-down select-icon"></i>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Комментарий</label>
                            <textarea id="modal-comment" rows="3" placeholder="Опишите причину простоя..." required></textarea>
                        </div>

                        <div class="form-group full-width" style="margin-top:-40px;">
                            <label>Служба</label>
                            <div class="search-select-container" id="department-container">
                                <div class="input-with-clear">
                                    <input type="text"
                                        class="search-input"
                                        id="modal-department-search"
                                        placeholder="Поиск службы..."
                                        autocomplete="off">
                                    <i class="fas fa-times clear-btn"></i>
                                </div>

                                <input type="hidden" id="modal-department-id">

                                <div id="selected-departments" class="selected-equipments"></div>
                                <div class="search-dropdown" id="department-dropdown"></div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn-neo btn-save">СОХРАНИТЬ</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="editModal" class="modal" style="display: none; align-items: center; justify-content: center;">
            <div class="modal-content glass-card">
                <div class="modal-header">
                    <h2><i class="fas fa-pen-nib"></i> Редактирование записи</span></h2>
                    <button class="close-modal" onclick="closeEditModal()">&times;</button>
                </div>
                <form id="editForm">
                    <input type="hidden" id="edit-entry-id">
                    <div class="modal-grid">

                        <div class="form-group full-width">
                            <label>Оборудование</label>
                            <div class="search-select-container" id="edit-eq-container"> <!-- Добавлен ID контейнера -->
                                <input type="text" class="search-input" id="edit-equipment-search" ...>
                                <input type="hidden" id="edit-equipment-id">
                                <div class="search-dropdown" id="edit-eq-dropdown"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Начало простоя</label>
                            <input type="datetime-local" id="edit-start" required>
                        </div>

                        <div class="form-group">
                            <label>Конец простоя</label>
                            <input type="datetime-local" id="edit-end">
                        </div>

                        <div class="form-group">
                            <label>Тип простоя</label>
                            <select id="edit-type" required></select>
                        </div>

                        <div class="form-group full-width">
                            <label>Кто создал (ФИО)</label>
                            <div class="search-select-container" id="edit-worker-container"> <!-- Добавлен ID контейнера -->
                                <input type="text" class="search-input" id="edit-worker-search" ...>
                                <input type="hidden" id="edit-worker-id">
                                <div class="search-dropdown" id="edit-worker-dropdown"></div>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label>Комментарий</label>
                            <textarea id="edit-comment" rows="2" required></textarea>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn-neo btn-save">ОБНОВИТЬ ДАННЫЕ</button>
                    </div>
                </form>
            </div>
        </div>

        <footer>
            <div class="footer-container">
                <p>Сектор информационных технологий &copy; 
                    <script>document.write(new Date().getFullYear())</script>
                </p>
            </div>
        </footer>

    </div>

    <div id="custom-toast" class="custom-toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message"></span>
    </div>

<script src="/static/js/downtimes.js?v={{ static_version }}"></script>
</body>

</html>
